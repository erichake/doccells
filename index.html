<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocCells</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.35);
        transition: opacity 0.3s ease;
      }

      #splash-screen svg {
        width: 500px;
        height: 200px;
        max-width: 90vw;
        max-height: 60vh;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      }

      #splash-screen.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash-screen" aria-label="DocCells" role="img">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
        <rect width="500" height="200" fill="#ffffff" />

        <g transform="translate(40,36)">
          <rect x="0" y="0" width="60" height="60" rx="12" fill="#60a5fa" />
          <rect x="68" y="0" width="60" height="60" rx="12" fill="#64748b" />
          <rect x="0" y="68" width="60" height="60" rx="12" fill="#64748b" />
          <rect x="68" y="68" width="60" height="60" rx="12" fill="#64748b" />
        </g>

        <text
          x="208"
          y="92"
          font-size="48"
          font-weight="700"
          fill="#1e293b"
          font-family="Arial, Helvetica, sans-serif"
        >
          DocCells
        </text>
        <text
          id="splash-tagline"
          x="208"
          y="130"
          font-size="22"
          font-weight="400"
          fill="#94a3b8"
          font-family="Arial, Helvetica, sans-serif"
        >
          Simple. Fast.
        </text>
        <text
          id="splash-version"
          x="208"
          y="154"
          font-size="13"
          font-weight="400"
          fill="#94a3b8"
          font-family="Arial, Helvetica, sans-serif"
        >
          version __DOCCELLS_BUILD_VERSION__
        </text>
      </svg>
    </div>
    <script>
      (function () {
        var splashTexts = {
          "zh-CN": "简单。快速。",
          "zh-TW": "簡單。快速。",
          en: "Simple. Fast.",
          "fr-FR": "Simple. Rapide.",
          "es-ES": "Simple. Rápido.",
          hi: "सरल. तेज़.",
          pt: "Simples. Rápido.",
          de: "Einfach. Schnell.",
          el: "Απλό. Γρήγορο.",
          it: "Semplice. Veloce.",
          nl: "Eenvoudig. Snel.",
        };
        var supportedSplashLangs = Object.keys(splashTexts);
        var browserLang = navigator.language || "en";
        var splashLang = supportedSplashLangs.includes(browserLang)
          ? browserLang
          : supportedSplashLangs.find(function (lang) {
              return browserLang.startsWith(lang.split("-")[0]);
            }) || "en";
        var tagline = document.getElementById("splash-tagline");
        if (tagline) {
          tagline.textContent = splashTexts[splashLang] || splashTexts.en;
        }

        var isTopWindow = true;
        try {
          isTopWindow = window.self === window.top;
        } catch (e) {
          isTopWindow = false;
        }

        var splash = document.getElementById("splash-screen");

        if (!isTopWindow) {
          splash.remove();
          return;
        }

        var minDelay = new Promise(function (resolve) {
          setTimeout(resolve, 1000);
        });
        var appReady = new Promise(function (resolve) {
          window.addEventListener("doccells:ready", resolve, { once: true });
        });

        Promise.all([minDelay, appReady]).then(function () {
          splash.classList.add("splash-hidden");
          splash.addEventListener(
            "transitionend",
            function () {
              splash.remove();
            },
            { once: true },
          );
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
