<h1>图片与链接</h1>
<h2 id="images">图片</h2>
<p><i data-i="image"></i> 或 <strong>插入 › Image</strong> 在选区位置插入计算机上的图片。</p>
<div class="table"><table><thead><tr><th>操作</th><th>效果</th></tr></thead><tbody>
<tr><td>拖动图片</td><td>移动</td></tr>
<tr><td>拖动控制点</td><td>调整大小</td></tr>
<tr><td>选中图片后按 <kbd>Delete</kbd></td><td>删除</td></tr>
</tbody></table></div>
<p>图片保存在 Excel 文件中的原位置。</p>
<h2 id="liens">链接</h2>
<p>选择单元格，右键 › <strong>插入链接</strong>。</p>
<div class="table"><table><thead><tr><th>链接类型</th><th>地址</th></tr></thead><tbody>
<tr><td>网页（<strong>网页</strong>）</td><td><code>https://…</code></td></tr>
<tr><td>单元格区域（<strong>单元格范围</strong>）</td><td><code>工作表1!A1:C8</code></td></tr>
<tr><td><strong>工作表</strong></td><td>工作簿中的工作表</td></tr>
</tbody></table></div>
<p><strong>显示文本</strong> 成为单元格的内容，蓝色带下划线。选中单元格时，其下方出现 <strong>打开链接</strong>。</p>
<div class="warn"><p>链接不保存在 Excel 文件中：只保存其文本。</p></div>
