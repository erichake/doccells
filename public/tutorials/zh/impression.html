<h1>打印</h1>
<p><strong>文件 › 打印…</strong> 或 <kbd>Ctrl</kbd> <kbd>P</kbd> 按打印效果显示页面。</p>
<figure><img src="img/imprimer.webp" alt="打印预览" width="1280" height="760" /></figure>
<div class="table"><table><thead><tr><th>设置</th><th>选项</th></tr></thead><tbody>
<tr><td><strong>内容</strong></td><td>当前工作表，或打开窗口前选择的单元格</td></tr>
<tr><td><strong>纸张</strong></td><td>A4、Letter</td></tr>
<tr><td><strong>方向</strong></td><td>纵向、横向</td></tr>
<tr><td><strong>缩放</strong></td><td><strong>实际大小</strong>；<strong>适合宽度</strong>：所有列在一页宽度内；<strong>适合一页</strong></td></tr>
<tr><td><strong>页边距</strong></td><td>普通、窄、宽</td></tr>
<tr><td><strong>格式</strong></td><td>网格线、行列标、填充颜色</td></tr>
</tbody></table></div>
<p><strong>打印…</strong> 打开浏览器的窗口，可选择打印机或保存为 PDF。</p>
<ul>
<li>只打印单元格及其格式：不打印图表、图片和迷你图。</li>
<li>隐藏的行和列不打印。</li>
<li>复选框打印为 TRUE 或 FALSE。</li>
<li>每次打印一张工作表。</li>
</ul>
<div class="tip"><p>要连同图表一起打印，请保存工作簿并用 Excel 或 LibreOffice 打开。</p></div>
</main>
