<h1>圖片與連結</h1>
<h2 id="images">圖片</h2>
<p><i data-i="image"></i> 或 <strong>插入 › Image</strong> 在選區位置插入計算機上的圖片。</p>
<div class="table"><table><thead><tr><th>操作</th><th>效果</th></tr></thead><tbody>
<tr><td>拖曳圖片</td><td>移動</td></tr>
<tr><td>拖曳控制點</td><td>調整大小</td></tr>
<tr><td>選中圖片後按 <kbd>Delete</kbd></td><td>刪除</td></tr>
</tbody></table></div>
<p>圖片儲存在 Excel 檔案中的原位置。</p>
<h2 id="liens">連結</h2>
<p>選擇儲存格，右鍵 › <strong>插入連結</strong>。</p>
<div class="table"><table><thead><tr><th>連結類型</th><th>位址</th></tr></thead><tbody>
<tr><td>網頁（<strong>網頁</strong>）</td><td><code>https://…</code></td></tr>
<tr><td>儲存格範圍（<strong>儲存格範圍</strong>）</td><td><code>工作表1!A1:C8</code></td></tr>
<tr><td><strong>工作表</strong></td><td>活頁簿中的工作表</td></tr>
</tbody></table></div>
<p><strong>文字</strong> 成為儲存格的內容，藍色帶下劃線。選中儲存格時，其下方出現 <strong>開啟連結</strong>。</p>
<div class="warn"><p>連結不儲存在 Excel 檔案中：只儲存其文字。</p></div>
