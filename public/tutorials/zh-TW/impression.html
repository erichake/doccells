<h1>列印</h1>
<p><strong>檔案 › 列印…</strong> 或 <kbd>Ctrl</kbd> <kbd>P</kbd> 按列印效果顯示頁面。</p>
<figure><img src="img/imprimer.webp" alt="列印預覽" width="1280" height="760" /></figure>
<div class="table"><table><thead><tr><th>設定</th><th>選項</th></tr></thead><tbody>
<tr><td><strong>內容</strong></td><td>當前工作表，或開啟視窗前選擇的儲存格</td></tr>
<tr><td><strong>紙張</strong></td><td>A4、Letter</td></tr>
<tr><td><strong>方向</strong></td><td>縱向、橫向</td></tr>
<tr><td><strong>縮放</strong></td><td><strong>實際大小</strong>；<strong>符合寬度</strong>：所有欄在一頁寬度內；<strong>符合單頁</strong></td></tr>
<tr><td><strong>邊界</strong></td><td>普通、窄、寬</td></tr>
<tr><td><strong>格式</strong></td><td>格線、欄列標題、填滿色彩</td></tr>
</tbody></table></div>
<p><strong>列印…</strong> 開啟瀏覽器的視窗，可選擇印表機或儲存為 PDF。</p>
<ul>
<li>只列印儲存格及其格式：不列印圖表、圖片和走勢圖。</li>
<li>隱藏的列和欄不列印。</li>
<li>核取方塊列印為 TRUE 或 FALSE。</li>
<li>每次列印一張工作表。</li>
</ul>
<div class="tip"><p>要連同圖表一起列印，請儲存活頁簿並用 Excel 或 LibreOffice 開啟。</p></div>
