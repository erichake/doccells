<!doctype html>
<!--
  Page d'essai du mode intégré (EMBED.md), hors build : avec `npm run dev`,
  ouvrir http://localhost:5174/fortunesheet/embed_test.html
  Le curseur écrit Feuille1!A1 à chaque image par postMessage ; la colonne
  B et la somme C1 suivent par l'abonnement.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>DocCells intégré — essai</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
      aside { padding: 12px; overflow: auto; border-right: 1px solid #ddd; }
      iframe { width: 100%; height: 100%; border: 0; }
      button, input { margin: 4px 0; }
      pre { font-size: 11px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <aside>
      <button id="load">Charger un classeur d'essai</button><br />
      <label>A1 <input id="a1" type="range" min="0" max="3" step="0.01" value="1" /></label>
      <div>C1 = <strong id="sum">—</strong></div>
      <button id="toggle">Masquer / afficher l'iframe</button><br />
      <button id="save">save (console)</button>
      <pre id="log"></pre>
    </aside>
    <iframe id="dc" src="./?embed"></iframe>
    <script>
      const iframe = document.getElementById("dc");
      const log = (line) => {
        const element = document.getElementById("log");
        element.textContent = `${line}\n${element.textContent}`.slice(0, 4000);
      };
      let nextId = 0;
      const pending = new Map();
      let sumSubscription = null;

      window.addEventListener("message", ({ source, data }) => {
        if (source !== iframe.contentWindow || data?.doccells !== 1) return;
        if (data.event === "values" && data.subscription === sumSubscription) {
          document.getElementById("sum").textContent = data.values[0][0];
          return;
        }
        if (data.event) {
          log(`événement ${data.event} ${JSON.stringify(data).slice(0, 120)}`);
          return;
        }
        const waiter = pending.get(data.id);
        pending.delete(data.id);
        data.ok ? waiter?.resolve(data.result) : waiter?.reject(new Error(data.error));
      });

      const request = (type, params = {}) =>
        new Promise((resolve, reject) => {
          const id = ++nextId;
          pending.set(id, { resolve, reject });
          iframe.contentWindow.postMessage({ doccells: 1, id, type, ...params }, "*");
        });

      const sampleWorkbook = () => {
        const celldata = [{ r: 0, c: 0, v: { v: 1, m: "1" } }];
        for (let i = 1; i <= 300; i += 1) {
          celldata.push({ r: i, c: 0, v: { v: i, m: String(i) } });
          celldata.push({ r: i, c: 1, v: { f: `=SIN($A$1*A${i + 1})+A${i + 1}^2/2` } });
        }
        celldata.push({ r: 0, c: 2, v: { f: "=SUM(B2:B301)" } });
        // Format d'archivage (WORKBOOK_FORMAT.md).
        return { format: "doccells", version: 1, sheets: [{ name: "Feuille1", celldata }] };
      };

      document.getElementById("load").onclick = async () => {
        await request("load", { workbook: sampleWorkbook() });
        const { subscription, values } = await request("subscribe", { ref: "Feuille1!C1" });
        sumSubscription = subscription;
        document.getElementById("sum").textContent = values[0][0];
        log("classeur chargé, abonné à Feuille1!C1");
      };

      let wanted = null;
      document.getElementById("a1").oninput = (event) => {
        if (wanted === null) {
          requestAnimationFrame(() => {
            iframe.contentWindow.postMessage(
              { doccells: 1, type: "setCellValues", updates: [{ ref: "Feuille1!A1", v: wanted }] },
              "*",
            );
            wanted = null;
          });
        }
        wanted = Number(event.target.value);
      };

      document.getElementById("toggle").onclick = () => {
        iframe.style.display = iframe.style.display === "none" ? "" : "none";
      };

      document.getElementById("save").onclick = async () => {
        const { workbook } = await request("save");
        console.log(workbook);
        log(`save : ${JSON.stringify(workbook).length} caractères (console)`);
      };
    </script>
  </body>
</html>
